<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breathing">
<title>Breathing</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #4a9e4a; --green-dark: #2e6e2e;
    --blue: #2f80ed; --bg: #f7f7f5; --surface: #ffffff;
    --text: #1a1a1a; --text-muted: #777; --border: rgba(0,0,0,0.10);
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --surface: #1c1c1e; --text: #f0f0f0; --text-muted: #888; --border: rgba(255,255,255,0.10); }
  }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body { display: flex; flex-direction: column;
    padding-top: calc(var(--safe-top) + 8px);
    padding-bottom: calc(var(--safe-bottom) + 8px); }

  /* TABS */
  .tabs { display: flex; gap: 6px; padding: 0 16px 10px; flex-shrink: 0; }
  .tab { flex: 1; padding: 8px 0; font-size: 13px; font-weight: 500;
    border-radius: 10px; border: 0.5px solid var(--border);
    background: transparent; color: var(--text-muted); cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: background 0.15s, color 0.15s; }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

  /* SCROLL */
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 16px; }

  /* CIRCLE */
  .circle-wrap { display: flex; flex-direction: column; align-items: center; padding: 8px 0 10px; }
  .circle-outer { width: 120px; height: 120px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 0.5px solid var(--border);
    position: relative; transition: transform 0.5s ease, background 0.5s ease, border-color 0.5s ease; }
  .circle-outer.expand  { transform: scale(1.15); background: #e8f4fd; border-color: #a8d4f5; }
  .circle-outer.hold-in { transform: scale(1.15); background: #e8f4fd; border-color: #a8d4f5; }
  .circle-outer.contract  { transform: scale(0.88); background: #edf7ed; border-color: #a8dca8; }
  .circle-outer.hold-out  { transform: scale(0.88); background: #edf7ed; border-color: #a8dca8; }
  @media (prefers-color-scheme: dark) {
    .circle-outer.expand, .circle-outer.hold-in { background: #1a2f40; border-color: #2a5070; }
    .circle-outer.contract, .circle-outer.hold-out { background: #1a2e1a; border-color: #2a502a; }
  }
  .ring-svg { position: absolute; top: -4px; left: -4px; width: 128px; height: 128px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 3; }
  .ring-fill { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 366; stroke-dashoffset: 366; transition: stroke-dashoffset 1s linear; }
  .circle-inner { text-align: center; }
  .phase-label { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .phase-count { font-size: 26px; font-weight: 300; color: var(--text); line-height: 1; }
  .phase-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

  /* TRACK TOGGLE (B&M) */
  .track-wrap { margin-bottom: 8px; }
  .track-toggle { display: grid; grid-template-columns: repeat(10, 1fr);
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 10px; overflow: hidden; gap: 2px; padding: 2px; }
  .track-btn { padding: 6px 0; font-size: 11px; font-weight: 500; color: var(--text-muted);
    background: transparent; border: none; cursor: pointer;
    border-radius: 7px; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: background 0.15s, color 0.15s; }
  .track-btn.active { background: var(--green); color: #fff; }
  .track-btn.empty { opacity: 0.25; cursor: default; }
  .track-label-text { font-size: 10px; color: var(--text-muted); text-align: center;
    margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* CONTROLS */
  .interval-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .interval-box { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 8px 10px; }
  .interval-box-label { font-size: 10px; color: var(--text-muted); margin-bottom: 5px;
    text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
  .interval-row { display: flex; align-items: stretch; }
  .interval-btn { flex: 1; min-height: 44px; border: none; background: transparent;
    font-size: 20px; color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent; border-radius: 8px; touch-action: manipulation; }
  .interval-btn:active { background: var(--border); }
  .interval-val { font-size: 20px; font-weight: 400; color: var(--text); flex: 1;
    text-align: center; display: flex; align-items: center; justify-content: center; }
  .duration-row { background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; }
  .duration-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .duration-label { font-size: 12px; color: var(--text-muted); }
  .duration-val { font-size: 13px; font-weight: 500; color: var(--text); }
  input[type=range] { width: 100%; accent-color: var(--blue); height: 4px; }
  .start-btn { width: 100%; padding: 13px; border-radius: 14px; border: none;
    background: var(--blue); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: opacity 0.15s; margin-bottom: 14px; }
  .start-btn:active { opacity: 0.85; }
  .start-btn.running { background: #e05; }

  /* MEDITATION PLAYER (B&M mode) */
  .med-player { background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; display: none; }
  .med-player.visible { display: block; }
  .med-player-label { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .med-progress-bg { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .med-progress-fill { height: 100%; background: var(--green); border-radius: 2px; width: 0%; transition: width 1s linear; }
  .med-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; display: flex; justify-content: space-between; }

  /* DIVIDER */
  .divider { height: 0.5px; background: var(--border); margin: 2px 0 12px; }

  /* BUBBLES */
  .bubbles-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .bubbles-count { font-size: 13px; color: var(--text-muted); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
  .bubble { width: 100%; aspect-ratio: 1; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    cursor: pointer; border: 1.5px solid var(--border); background: var(--surface);
    transition: transform 0.12s, background 0.25s;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  .bubble:active { transform: scale(0.88); }
  .bubble.today { border: 2px solid var(--blue); }
  .bubble.done-meditation { background: #2e7d32; border-color: #1b5e20; }
  .bubble.done-breathing  { background: #81c784; border-color: #4caf50; }
  .bubble.done-both       { background: #1a3a1a; border-color: #0a1f0a; }
  .bubble .day-num { font-size: clamp(9px, 3vw, 12px); font-weight: 500; color: var(--text-muted); line-height: 1; }
  .bubble.done-meditation .day-num, .bubble.done-breathing .day-num, .bubble.done-both .day-num { color: #fff; }
  .bubble.today:not(.done-meditation):not(.done-breathing):not(.done-both) .day-num { color: var(--blue); }
  .bubble .month-tag { font-size: 7px; color: var(--text-muted); opacity: 0.7; margin-top: 1px; }
  .bubble.done-meditation .month-tag, .bubble.done-breathing .month-tag, .bubble.done-both .month-tag { color: rgba(255,255,255,0.75); }

  /* CONFIRM */
  .confirm { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 300; align-items: flex-end; }
  .confirm.visible { display: flex; }
  .confirm-inner { background: var(--surface); width: 100%; border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + var(--safe-bottom)); text-align: center; }
  .confirm-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .confirm-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  .confirm-btns { display: flex; gap: 10px; }
  .confirm-btn { flex: 1; padding: 13px; border-radius: 12px; border: 0.5px solid var(--border);
    background: transparent; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--text);
    -webkit-tap-highlight-color: transparent; }
  .confirm-btn.danger { color: #e05; border-color: #e05; }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" id="tab-breathe" onclick="switchTab('breathe')">Breathe</button>
  <button class="tab" id="tab-bm" onclick="switchTab('bm')">B&amp;M</button>
</div>

<div class="scroll">

  <!-- CIRCLE (shared) -->
  <div class="circle-wrap">
    <div class="circle-outer" id="circle">
      <svg class="ring-svg" viewBox="0 0 128 128">
        <circle class="ring-bg" cx="64" cy="64" r="58"/>
        <circle class="ring-fill" id="ring" cx="64" cy="64" r="58"/>
      </svg>
      <div class="circle-inner">
        <div class="phase-label" id="phase-label">Ready</div>
        <div class="phase-count" id="phase-count">—</div>
        <div class="phase-sub" id="phase-sub"></div>
      </div>
    </div>
  </div>

  <!-- B&M TRACK SELECTOR -->
  <div class="track-wrap" id="track-wrap" style="display:none">
    <div class="track-toggle" id="track-toggle"></div>
    <div class="track-label-text" id="track-label-text"></div>
  </div>

  <!-- INTERVAL CONTROLS (shared) -->
  <div class="interval-grid">
    <div class="interval-box">
      <div class="interval-box-label">Inhale</div>
      <div class="interval-row">
        <button class="interval-btn" onclick="adj('inhale',-1)">−</button>
        <div class="interval-val" id="val-inhale">4</div>
        <button class="interval-btn" onclick="adj('inhale',1)">+</button>
      </div>
    </div>
    <div class="interval-box">
      <div class="interval-box-label">Hold in</div>
      <div class="interval-row">
        <button class="interval-btn" onclick="adj('holdin',-1)">−</button>
        <div class="interval-val" id="val-holdin">4</div>
        <button class="interval-btn" onclick="adj('holdin',1)">+</button>
      </div>
    </div>
    <div class="interval-box">
      <div class="interval-box-label">Exhale</div>
      <div class="interval-row">
        <button class="interval-btn" onclick="adj('exhale',-1)">−</button>
        <div class="interval-val" id="val-exhale">4</div>
        <button class="interval-btn" onclick="adj('exhale',1)">+</button>
      </div>
    </div>
    <div class="interval-box">
      <div class="interval-box-label">Hold out</div>
      <div class="interval-row">
        <button class="interval-btn" onclick="adj('holdout',-1)">−</button>
        <div class="interval-val" id="val-holdout">4</div>
        <button class="interval-btn" onclick="adj('holdout',1)">+</button>
      </div>
    </div>
  </div>

  <!-- DURATION -->
  <div class="duration-row">
    <div class="duration-top">
      <span class="duration-label">Breathing duration</span>
      <span class="duration-val" id="dur-label">5 min</span>
    </div>
    <input type="range" min="1" max="30" value="5" id="dur-slider" oninput="updateDur()">
  </div>

  <button class="start-btn" id="start-btn" onclick="toggleSession()">Start</button>

  <!-- MEDITATION PLAYER (B&M only, shown after breathing ends) -->
  <div class="med-player" id="med-player">
    <div class="med-player-label" id="med-player-label">Now playing meditation...</div>
    <div class="med-progress-bg"><div class="med-progress-fill" id="med-prog"></div></div>
    <div class="med-time"><span id="med-cur">0:00</span><span id="med-tot">0:00</span></div>
  </div>

  <div class="divider"></div>

  <div class="bubbles-header">
    <div class="bubbles-count" id="streak-label">0 done</div>
  </div>
  <div class="grid" id="grid"></div>

</div>

<div class="confirm" id="confirm" onclick="confirmBgClick(event)">
  <div class="confirm-inner">
    <div class="confirm-title" id="confirm-title">Mark as done?</div>
    <div class="confirm-sub" id="confirm-sub"></div>
    <div class="confirm-btns">
      <button class="confirm-btn" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-btn danger" id="confirm-action-btn" onclick="confirmAction()">Confirm</button>
    </div>
  </div>
</div>

<audio id="med-audio" preload="none"></audio>

<script>
const SUPABASE_URL = 'https://zymulpyuxxpqbtqxkrmu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5bXVscHl1eHhwcWJ0cXhrcm11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2OTg1NjAsImV4cCI6MjA5MTI3NDU2MH0.qdl9-l45Fv-prTECEXhUl8S5QeTA8qIJ6YuoRgEYJUc';
const STORAGE_URL = `${SUPABASE_URL}/storage/v1/object/public/audio`;
const LETTERS = ['A','B','C','D','E','F','G','H','I','J'];

const TRACKS = {
  A: { label: 'The Call From Within — Mooji', url: `${STORAGE_URL}/A.mp3` },
  B: { label: 'Head to Heart — Guided', url: `${STORAGE_URL}/B.mp3` },
  C: { label: "Don't Identify — Mooji", url: `${STORAGE_URL}/C.mp3` },
  D: { label: 'The Quiet Immensity Within — Adya', url: `${STORAGE_URL}/D.mp3` },
  E: { label: '478 Breathing Exercise 10 Minutes', url: `${STORAGE_URL}/E.mp3` },
  F: null, G: null, H: null, I: null, J: null
};

async function sbFetch(path, opts={}) {
  return fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json', 'Prefer': 'return=minimal', ...opts.headers },
    ...opts
  });
}

// ── STATE ──
let currentTab = 'breathe';
let currentTrack = 'A';
let intervals = { inhale: 4, holdin: 4, exhale: 4, holdout: 4 };
let durMin = 5;
let running = false;
let wakeLock = null;
let phaseTimer = null;
let medTimer = null;
let sessionEndTime = null;
let currentPhaseIdx = 0;
let done = {};
let confirmDateStr = null;
let confirmIsDone = false;
let settingsSaveTimer = null;

const phases = [
  { key: 'inhale', label: 'Inhale', circle: 'expand'   },
  { key: 'holdin', label: 'Hold',   circle: 'hold-in'  },
  { key: 'exhale', label: 'Exhale', circle: 'contract' },
  { key: 'holdout',label: 'Hold',   circle: 'hold-out' },
];

const today = new Date(); today.setHours(0,0,0,0);
function dateStr(d) { return d.toISOString().split('T')[0]; }
function fmt(s) { s = Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

// ── TABS ──
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-breathe').classList.toggle('active', tab === 'breathe');
  document.getElementById('tab-bm').classList.toggle('active', tab === 'bm');
  document.getElementById('track-wrap').style.display = tab === 'bm' ? 'block' : 'none';
  document.getElementById('duration-label-text') && (document.getElementById('duration-label-text').textContent =
    tab === 'bm' ? 'Breathing duration' : 'Total duration');
  schedSaveSettings();
}

// ── TRACK TOGGLE ──
function buildTrackToggle() {
  const tog = document.getElementById('track-toggle');
  tog.innerHTML = '';
  LETTERS.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'track-btn' + (k === currentTrack ? ' active' : '') + (!TRACKS[k] ? ' empty' : '');
    btn.textContent = k;
    if (TRACKS[k]) btn.onclick = () => selectTrack(k);
    tog.appendChild(btn);
  });
  document.getElementById('track-label-text').textContent = TRACKS[currentTrack] ? TRACKS[currentTrack].label : '';
}

function selectTrack(k) {
  if (!TRACKS[k]) return;
  currentTrack = k;
  LETTERS.forEach(l => {
    const b = document.querySelector(`#track-toggle .track-btn:nth-child(${LETTERS.indexOf(l)+1})`);
    if (b) b.classList.toggle('active', l === k);
  });
  document.getElementById('track-label-text').textContent = TRACKS[k].label;
  schedSaveSettings();
}

// ── AUDIO TONES ──
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, dur, vol=0.12) {
  try {
    const ctx = getAudioCtx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + 0.25);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function cue(phase) {
  if (navigator.vibrate) {
    if (phase === 'inhale') navigator.vibrate(60);
    else if (phase === 'holdin') navigator.vibrate([40,40,40]);
    else if (phase === 'exhale') navigator.vibrate(100);
    else if (phase === 'holdout') navigator.vibrate([40,40,40]);
  }
  if (phase === 'inhale') playTone(174, 0.3);
  else if (phase === 'holdin') playTone(136, 0.25, 0.08);
  else if (phase === 'exhale') playTone(117, 0.35);
  else if (phase === 'holdout') playTone(98, 0.25, 0.08);
}

// ── SETTINGS ──
async function loadSettings() {
  try {
    const res = await sbFetch('breathing_settings?select=key,value');
    const rows = await res.json();
    if (Array.isArray(rows)) rows.forEach(r => {
      if (r.key === 'intervals') Object.assign(intervals, JSON.parse(r.value));
      if (r.key === 'duration') durMin = parseInt(r.value);
      if (r.key === 'tab') currentTab = r.value;
      if (r.key === 'track') currentTrack = r.value;
    });
  } catch(e) {
    try {
      const s = JSON.parse(localStorage.getItem('breath_settings') || '{}');
      if (s.intervals) Object.assign(intervals, s.intervals);
      if (s.durMin) durMin = s.durMin;
      if (s.tab) currentTab = s.tab;
      if (s.track) currentTrack = s.track;
    } catch(e2) {}
  }
  // Apply to UI
  ['inhale','holdin','exhale','holdout'].forEach(k => document.getElementById('val-'+k).textContent = intervals[k]);
  document.getElementById('dur-slider').value = durMin;
  document.getElementById('dur-label').textContent = durMin + ' min';
  if (currentTab === 'bm') {
    document.getElementById('tab-breathe').classList.remove('active');
    document.getElementById('tab-bm').classList.add('active');
    document.getElementById('track-wrap').style.display = 'block';
  }
  buildTrackToggle();
}

function schedSaveSettings() {
  clearTimeout(settingsSaveTimer);
  settingsSaveTimer = setTimeout(saveSettings, 1500);
}

async function saveSettings() {
  const payload = [
    { key: 'intervals', value: JSON.stringify(intervals) },
    { key: 'duration',  value: String(durMin) },
    { key: 'tab',       value: currentTab },
    { key: 'track',     value: currentTrack },
  ];
  localStorage.setItem('breath_settings', JSON.stringify({ intervals, durMin, tab: currentTab, track: currentTrack }));
  try {
    for (const row of payload) {
      await sbFetch(`breathing_settings?key=eq.${row.key}`, { method: 'DELETE' });
      await sbFetch('breathing_settings', { method: 'POST', body: JSON.stringify(row) });
    }
  } catch(e) {}
}

// ── CONTROLS ──
function adj(key, delta) {
  intervals[key] = Math.max(0, Math.min(20, intervals[key] + delta));
  document.getElementById('val-'+key).textContent = intervals[key];
  schedSaveSettings();
}
function updateDur() {
  durMin = parseInt(document.getElementById('dur-slider').value);
  document.getElementById('dur-label').textContent = durMin + ' min';
  schedSaveSettings();
}

// ── BREATHING SESSION ──
function toggleSession() {
  if (running) stopAll(true);
  else startBreathing();
}

function startBreathing() {
  getAudioCtx();
  running = true;
  sessionEndTime = Date.now() + durMin * 60 * 1000;
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(l => { wakeLock = l; }).catch(()=>{});
  document.getElementById('start-btn').textContent = 'Stop';
  document.getElementById('start-btn').classList.add('running');
  currentPhaseIdx = 0;
  startPhase();
}

function startPhase() {
  if (!running) return;
  const phase = phases[currentPhaseIdx];
  const secs = intervals[phase.key];
  if (secs === 0) { currentPhaseIdx = (currentPhaseIdx+1)%4; startPhase(); return; }
  cue(phase.key);
  updateCircle(phase, secs, secs);
  clearInterval(phaseTimer);
  phaseTimer = setInterval(() => {
    const remaining = sessionEndTime - Date.now();
    if (remaining <= 0) { clearInterval(phaseTimer); breathingComplete(); return; }
    const left = --phase._left !== undefined ? phase._left : secs;
    // use a local counter instead
  }, 1000);
  // cleaner approach with closure
  clearInterval(phaseTimer);
  let left = secs;
  phaseTimer = setInterval(() => {
    left--;
    const remaining = sessionEndTime - Date.now();
    if (remaining <= 0) { clearInterval(phaseTimer); breathingComplete(); return; }
    if (left <= 0) { clearInterval(phaseTimer); currentPhaseIdx = (currentPhaseIdx+1)%4; startPhase(); }
    else updateCircle(phase, left, secs);
  }, 1000);
}

function updateCircle(phase, left, total) {
  document.getElementById('circle').className = 'circle-outer ' + phase.circle;
  document.getElementById('phase-label').textContent = phase.label;
  document.getElementById('phase-count').textContent = left;
  const remaining = Math.max(0, sessionEndTime - Date.now());
  document.getElementById('phase-sub').textContent = fmt(remaining/1000) + ' left';
  document.getElementById('ring').style.strokeDashoffset = 366 - (366 * (1 - left/total));
}

async function breathingComplete() {
  // Reset circle
  document.getElementById('circle').className = 'circle-outer';
  document.getElementById('phase-label').textContent = currentTab === 'bm' ? 'Meditating' : 'Done ✓';
  document.getElementById('phase-count').textContent = '—';
  document.getElementById('phase-sub').textContent = '';
  document.getElementById('ring').style.strokeDashoffset = 366;

  if (currentTab === 'breathe') {
    // Breathe-only: mark breathing done
    running = false;
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
    document.getElementById('start-btn').textContent = 'Start';
    document.getElementById('start-btn').classList.remove('running');
    const ds = dateStr(today);
    if (!(done[ds] && done[ds].includes('breathing'))) await addDone(ds, 'breathing');
  } else {
    // B&M: start meditation immediately
    startMeditation();
  }
}

async function stopAll(manual) {
  running = false;
  clearInterval(phaseTimer);
  clearInterval(medTimer);
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
  document.getElementById('start-btn').textContent = 'Start';
  document.getElementById('start-btn').classList.remove('running');
  document.getElementById('circle').className = 'circle-outer';
  document.getElementById('phase-label').textContent = 'Ready';
  document.getElementById('phase-count').textContent = '—';
  document.getElementById('phase-sub').textContent = '';
  document.getElementById('ring').style.strokeDashoffset = 366;
  document.getElementById('med-player').classList.remove('visible');
  const medAudio = document.getElementById('med-audio');
  medAudio.pause(); medAudio.currentTime = 0;
}

// ── MEDITATION PLAYER (B&M) ──
function startMeditation() {
  const track = TRACKS[currentTrack];
  if (!track) { finishBM(); return; }
  const medAudio = document.getElementById('med-audio');
  medAudio.src = track.url;
  medAudio.currentTime = 0;
  medAudio.play().catch(()=>{});
  document.getElementById('med-player').classList.add('visible');
  document.getElementById('med-player-label').textContent = track.label;
  document.getElementById('med-prog').style.width = '0%';
  clearInterval(medTimer);
  medTimer = setInterval(updateMedProgress, 1000);
  medAudio.onended = async () => {
    clearInterval(medTimer);
    document.getElementById('med-prog').style.width = '100%';
    await finishBM();
  };
}

function updateMedProgress() {
  const medAudio = document.getElementById('med-audio');
  const dur = medAudio.duration || 0;
  const cur = medAudio.currentTime || 0;
  document.getElementById('med-prog').style.width = (dur > 0 ? (cur/dur)*100 : 0) + '%';
  document.getElementById('med-cur').textContent = fmt(cur);
  document.getElementById('med-tot').textContent = fmt(dur);
}

async function finishBM() {
  running = false;
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
  document.getElementById('start-btn').textContent = 'Start';
  document.getElementById('start-btn').classList.remove('running');
  // Mark both sources
  const ds = dateStr(today);
  if (!(done[ds] && done[ds].includes('breathing'))) await addDone(ds, 'breathing');
  if (!(done[ds] && done[ds].includes('meditation'))) await addDone(ds, 'meditation');
}

// ── COMPLETIONS ──
async function loadDone() {
  try {
    const res = await sbFetch('completions?select=date,source');
    const data = await res.json();
    done = {};
    data.forEach(r => {
      if (!done[r.date]) done[r.date] = [];
      done[r.date].push(r.source || 'meditation');
    });
  } catch(e) {
    const arr = JSON.parse(localStorage.getItem('done') || '[]');
    done = {};
    arr.forEach(d => { done[d] = ['breathing']; });
  }
  buildGrid();
  document.getElementById('streak-label').textContent = Object.keys(done).length + ' done';
}

async function addDone(ds, source) {
  if (!done[ds]) done[ds] = [];
  if (!done[ds].includes(source)) done[ds].push(source);
  localStorage.setItem('done', JSON.stringify(Object.keys(done)));
  buildGrid();
  document.getElementById('streak-label').textContent = Object.keys(done).length + ' done';
  try { await sbFetch('completions', { method: 'POST', body: JSON.stringify({ date: ds, source }) }); } catch(e) {}
}

async function removeDone(ds, source) {
  if (done[ds]) {
    done[ds] = done[ds].filter(s => s !== source);
    if (done[ds].length === 0) delete done[ds];
  }
  localStorage.setItem('done', JSON.stringify(Object.keys(done)));
  buildGrid();
  document.getElementById('streak-label').textContent = Object.keys(done).length + ' done';
  try { await sbFetch(`completions?date=eq.${ds}&source=eq.${source}`, { method: 'DELETE' }); } catch(e) {}
}

// ── GRID ──
function buildGrid() {
  const grid = document.getElementById('grid');
  const todayStr = dateStr(today);
  grid.innerHTML = '';
  for (let i = 0; i < 100; i++) {
    const d = new Date(today); d.setDate(today.getDate()-i);
    const ds = dateStr(d);
    const sources = done[ds] || [];
    const hasMed = sources.includes('meditation'), hasBre = sources.includes('breathing');
    const doneClass = hasMed && hasBre ? ' done-both' : hasMed ? ' done-meditation' : hasBre ? ' done-breathing' : '';
    const el = document.createElement('div');
    el.className = 'bubble' + doneClass + (ds === todayStr ? ' today' : '');
    const num = document.createElement('div');
    num.className = 'day-num'; num.textContent = d.getDate();
    el.appendChild(num);
    if (i === 0 || d.getDate() === 1) {
      const mo = document.createElement('div');
      mo.className = 'month-tag';
      mo.textContent = d.toLocaleString('default', {month:'short'});
      el.appendChild(mo);
    }
    el.addEventListener('click', () => openConfirm(ds, d));
    grid.appendChild(el);
  }
}

// ── CONFIRM ──
function openConfirm(ds, d) {
  confirmDateStr = ds;
  const sources = done[ds] || [];
  confirmIsDone = sources.length > 0;
  document.getElementById('confirm-title').textContent = confirmIsDone ? 'Undo completion?' : 'Mark as done?';
  document.getElementById('confirm-sub').textContent = d.toLocaleDateString(undefined, {weekday:'short',month:'short',day:'numeric'});
  document.getElementById('confirm-action-btn').textContent = confirmIsDone ? 'Undo' : 'Mark done';
  document.getElementById('confirm').classList.add('visible');
}
function closeConfirm() { document.getElementById('confirm').classList.remove('visible'); confirmDateStr = null; }
async function confirmAction() {
  if (!confirmDateStr) return;
  if (confirmIsDone) {
    // Remove all sources for this date
    const sources = [...(done[confirmDateStr] || [])];
    for (const s of sources) await removeDone(confirmDateStr, s);
  } else {
    await addDone(confirmDateStr, currentTab === 'bm' ? 'breathing' : 'breathing');
  }
  closeConfirm();
}
function confirmBgClick(e) { if (e.target === document.getElementById('confirm')) closeConfirm(); }

// ── WAKE LOCK re-acquire ──
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running && 'wakeLock' in navigator) {
    navigator.wakeLock.request('screen').then(l => { wakeLock = l; }).catch(()=>{});
  }
});

// ── INIT ──
loadSettings();
loadDone();
</script>
