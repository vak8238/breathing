<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meditate">
<title>Meditate</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #4a9e4a; --green-dark: #2e6e2e;
    --blue: #2f80ed; --bg: #f7f7f5; --surface: #ffffff;
    --text: #1a1a1a; --text-muted: #777; --border: rgba(0,0,0,0.10);
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --surface: #1c1c1e; --text: #f0f0f0; --text-muted: #888; --border: rgba(255,255,255,0.10); }
  }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body { display: flex; flex-direction: column;
    padding-top: calc(var(--safe-top) + 8px);
    padding-bottom: calc(var(--safe-bottom) + 8px); }

  /* TABS */
  .tabs { display: flex; gap: 6px; padding: 0 16px 10px; flex-shrink: 0; }
  .tab { flex: 1; padding: 8px 0; font-size: 13px; font-weight: 500;
    border-radius: 10px; border: 0.5px solid var(--border);
    background: transparent; color: var(--text-muted); cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: background 0.15s, color 0.15s; }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 16px; }

  /* TRACK TOGGLE */
  .track-wrap { margin-bottom: 6px; }
  .track-toggle { display: grid; grid-template-columns: repeat(10, 1fr);
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 10px; gap: 2px; padding: 2px; }
  .track-btn { padding: 6px 0; font-size: 11px; font-weight: 500; color: var(--text-muted);
    background: transparent; border: none; cursor: pointer; border-radius: 7px;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: background 0.15s, color 0.15s; }
  .track-btn.active  { background: var(--green); color: #fff; }
  .track-btn.active2 { background: var(--blue);  color: #fff; }
  .track-btn.empty { opacity: 0.25; cursor: default; }
  .track-label-text { font-size: 10px; color: var(--text-muted); text-align: center;
    margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* PLAYER */
  .med-player { background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 12px; padding: 8px 12px; margin-bottom: 6px; margin-top: 8px; display: none; }
  .med-player.visible { display: block; }
  .med-player.done-track { opacity: 0.5; }
  .med-player-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .med-player.active2 .med-player-label { color: var(--blue); }
  .med-progress-bg { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .med-progress-fill { height: 100%; background: var(--green); border-radius: 2px; width: 0%; transition: width 1s linear; }
  .med-player.active2 .med-progress-fill { background: var(--blue); }
  .med-time { font-size: 11px; color: var(--text-muted); margin-top: 3px; display: flex; justify-content: space-between; }

  /* BUTTONS */
  .btn-row { display: flex; gap: 8px; margin-bottom: 10px; display: none; }
  .btn-row.visible { display: flex; }
  .stop-btn { flex: 1; padding: 13px; border-radius: 14px; border: none;
    background: #e05; color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .done-btn { flex: 1; padding: 13px; border-radius: 14px;
    border: 1.5px solid var(--green); background: transparent; color: var(--green);
    font-size: 13px; font-weight: 600; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .done-btn.undo { border-color: var(--text-muted); color: var(--text-muted); }

  /* DIVIDER */
  .divider { height: 0.5px; background: var(--border); margin: 4px 0 12px; }

  /* BUBBLES */
  .bubbles-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .bubbles-count { font-size: 13px; color: var(--text-muted); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
  .bubble { width: 100%; aspect-ratio: 1; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    cursor: pointer; border: 1.5px solid var(--border); background: var(--surface);
    transition: transform 0.12s, background 0.25s;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  .bubble:active { transform: scale(0.88); }
  .bubble.today { border: 2px solid var(--blue); }
  .bubble.done-meditation { background: #2e7d32; border-color: #1b5e20; }
  .bubble.done-2m         { background: #1a3a1a; border-color: #0a1f0a; }
  .bubble .day-num { font-size: clamp(9px, 3vw, 12px); font-weight: 500; color: var(--text-muted); line-height: 1; }
  .bubble.done-meditation .day-num, .bubble.done-2m .day-num { color: #fff; }
  .bubble.today:not(.done-meditation):not(.done-2m) .day-num { color: var(--blue); }
  .bubble .month-tag { font-size: 7px; color: var(--text-muted); opacity: 0.7; margin-top: 1px; }
  .bubble.done-meditation .month-tag, .bubble.done-2m .month-tag { color: rgba(255,255,255,0.75); }

  /* ADMIN */
  .admin-toggle { position: fixed; bottom: calc(20px + var(--safe-bottom)); right: 16px;
    width: 32px; height: 32px; border-radius: 50%; border: 0.5px solid var(--border);
    background: var(--surface); cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 14px; opacity: 0.4; z-index: 100;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .admin-panel { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 200; align-items: flex-end; }
  .admin-panel.visible { display: flex; }
  .admin-inner { background: var(--surface); width: 100%; border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + var(--safe-bottom)); max-height: 80vh; overflow-y: auto; }
  .admin-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .track-row { display: flex; align-items: center; gap: 10px; padding: 10px 0;
    border-bottom: 0.5px solid var(--border); }
  .track-letter { width: 28px; height: 28px; border-radius: 50%; background: var(--green);
    color: #fff; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .track-letter.empty-slot { background: var(--border); color: var(--text-muted); }
  .track-name-input { flex: 1; font-size: 13px; border: none; background: transparent;
    color: var(--text); outline: none; padding: 0; }
  .upload-btn { font-size: 12px; padding: 5px 10px; border-radius: 6px;
    border: 0.5px solid var(--border); background: transparent; color: var(--text-muted);
    cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .admin-close { width: 100%; margin-top: 16px; padding: 12px; border-radius: 10px;
    border: 0.5px solid var(--border); background: transparent; color: var(--text);
    font-size: 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  input[type="file"] { display: none; }

  /* CONFIRM */
  .confirm { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 300; align-items: flex-end; }
  .confirm.visible { display: flex; }
  .confirm-inner { background: var(--surface); width: 100%; border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + var(--safe-bottom)); text-align: center; }
  .confirm-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .confirm-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  .confirm-btns { display: flex; gap: 10px; }
  .confirm-btn { flex: 1; padding: 13px; border-radius: 12px; border: 0.5px solid var(--border);
    background: transparent; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--text);
    -webkit-tap-highlight-color: transparent; }
  .confirm-btn.danger { color: #e05; border-color: #e05; }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" id="tab-m"  onclick="switchTab('m')">M</button>
  <button class="tab"        id="tab-2m" onclick="switchTab('2m')">2M</button>
</div>

<div class="scroll">

  <!-- Track selector 1 (M + 2M) -->
  <div class="track-wrap" id="track-wrap-1">
    <div class="track-toggle" id="track-toggle-1"></div>
    <div class="track-label-text" id="track-label-1"></div>
  </div>

  <!-- Track selector 2 (2M only) -->
  <div class="track-wrap" id="track-wrap-2" style="display:none">
    <div class="track-toggle" id="track-toggle-2"></div>
    <div class="track-label-text" id="track-label-2"></div>
  </div>

  <!-- Player 1 -->
  <div class="med-player" id="player-1">
    <div class="med-player-label" id="player-1-label"></div>
    <div class="med-progress-bg"><div class="med-progress-fill" id="prog-1"></div></div>
    <div class="med-time"><span id="cur-1">0:00</span><span id="tot-1">0:00</span></div>
  </div>

  <!-- Player 2 (2M only) -->
  <div class="med-player active2" id="player-2">
    <div class="med-player-label" id="player-2-label"></div>
    <div class="med-progress-bg"><div class="med-progress-fill" id="prog-2"></div></div>
    <div class="med-time"><span id="cur-2">0:00</span><span id="tot-2">0:00</span></div>
  </div>

  <!-- Stop / Done -->
  <div class="btn-row" id="btn-row">
    <button class="stop-btn" onclick="stopSession()">Stop</button>
    <button class="done-btn" id="done-btn" onclick="handleDoneBtn()">✓ Done</button>
  </div>

  <div class="divider"></div>
  <div class="bubbles-header"><div class="bubbles-count" id="streak-label">0 done</div></div>
  <div class="grid" id="grid"></div>
</div>

<button class="admin-toggle" onclick="openAdmin()">⚙️</button>

<div class="admin-panel" id="admin-panel" onclick="adminBgClick(event)">
  <div class="admin-inner">
    <div class="admin-title">Manage tracks</div>
    <div id="track-rows"></div>
    <button class="admin-close" onclick="closeAdmin()">Done</button>
  </div>
</div>

<div class="confirm" id="confirm" onclick="confirmBgClick(event)">
  <div class="confirm-inner">
    <div class="confirm-title" id="confirm-title">Mark as done?</div>
    <div class="confirm-sub" id="confirm-sub"></div>
    <div class="confirm-btns">
      <button class="confirm-btn" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-btn danger" id="confirm-action-btn" onclick="confirmAction()">Confirm</button>
    </div>
  </div>
</div>

<audio id="audio-1" preload="none"></audio>
<audio id="audio-2" preload="none"></audio>

<script>
const SUPABASE_URL = 'https://zymulpyuxxpqbtqxkrmu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5bXVscHl1eHhwcWJ0cXhrcm11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2OTg1NjAsImV4cCI6MjA5MTI3NDU2MH0.qdl9-l45Fv-prTECEXhUl8S5QeTA8qIJ6YuoRgEYJUc';
const STORAGE_URL = `${SUPABASE_URL}/storage/v1/object/public/audio`;
const LETTERS = ['A','B','C','D','E','F','G','H','I','J'];
const TRACKS = {
  A: { label: 'The Call From Within — Mooji',      url: `${STORAGE_URL}/A.mp3` },
  B: { label: 'Head to Heart — Guided',             url: `${STORAGE_URL}/B.mp3` },
  C: { label: "Don't Identify — Mooji",             url: `${STORAGE_URL}/C.mp3` },
  D: { label: 'The Quiet Immensity Within — Adya',  url: `${STORAGE_URL}/D.mp3` },
  E: { label: 'Deep Relaxation Visualisation',      url: `${STORAGE_URL}/E.mp3` },
  F: { label: 'Om Gam 15',                          url: `${STORAGE_URL}/F.mp3` },
  G: { label: 'Guided Morning 10',                  url: `${STORAGE_URL}/G.mp3` },
  H: null, I: null, J: null
};

async function sbFetch(path, opts={}) {
  return fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json', 'Prefer': 'return=minimal', ...opts.headers },
    ...opts });
}

// ── STATE ──
let currentTab = 'm';
let track1 = 'A', track2 = 'B';
let activeDateStr = null;
let medTimer1 = null, medTimer2 = null;
let wakeLock = null;
let track1Done = false;
let done = {};
let confirmDateStr = null, confirmIsDone = false;
let settingsSaveTimer = null;

const today = new Date(); today.setHours(0,0,0,0);
function dateStr(d) { return d.toISOString().split('T')[0]; }
function fmt(s) { s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

// ── TABS ──
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-m').classList.toggle('active', tab==='m');
  document.getElementById('tab-2m').classList.toggle('active', tab==='2m');
  document.getElementById('track-wrap-2').style.display = tab==='2m' ? 'block' : 'none';
  schedSaveSettings();
}

// ── TRACK TOGGLES ──
function buildToggle(n, current, activeClass) {
  const tog = document.getElementById(`track-toggle-${n}`);
  tog.innerHTML = '';
  LETTERS.forEach(k => {
    const btn = document.createElement('button');
    const isActive = k === current;
    btn.className = 'track-btn' + (isActive ? ' '+activeClass : '') + (!TRACKS[k] ? ' empty' : '');
    btn.textContent = k;
    if (TRACKS[k]) btn.onclick = () => selectTrack(n, k);
    tog.appendChild(btn);
  });
  document.getElementById(`track-label-${n}`).textContent = TRACKS[current] ? TRACKS[current].label : '';
}
function buildToggles() {
  buildToggle(1, track1, 'active');
  buildToggle(2, track2, 'active2');
}
function selectTrack(n, k) {
  if (!TRACKS[k]) return;
  if (n===1) track1=k; else track2=k;
  buildToggles();
  schedSaveSettings();
}

// ── SETTINGS ──
async function loadSettings() {
  try {
    const res = await sbFetch('breathing_settings?select=key,value');
    const rows = await res.json();
    if (Array.isArray(rows)) rows.forEach(r => {
      if (r.key==='tab2')   currentTab = r.value;
      if (r.key==='track1') track1 = r.value;
      if (r.key==='track2') track2 = r.value;
    });
  } catch(e) {
    try {
      const s = JSON.parse(localStorage.getItem('med2_settings')||'{}');
      if (s.tab)    currentTab = s.tab;
      if (s.track1) track1 = s.track1;
      if (s.track2) track2 = s.track2;
    } catch(e2) {}
  }
  if (currentTab==='2m') {
    document.getElementById('tab-m').classList.remove('active');
    document.getElementById('tab-2m').classList.add('active');
    document.getElementById('track-wrap-2').style.display = 'block';
  }
  buildToggles();
}
function schedSaveSettings() {
  clearTimeout(settingsSaveTimer);
  settingsSaveTimer = setTimeout(saveSettings, 1500);
}
async function saveSettings() {
  const payload = [
    { key: 'tab2',   value: currentTab },
    { key: 'track1', value: track1 },
    { key: 'track2', value: track2 },
  ];
  localStorage.setItem('med2_settings', JSON.stringify({ tab: currentTab, track1, track2 }));
  try {
    for (const row of payload) {
      await sbFetch(`breathing_settings?key=eq.${row.key}`, { method: 'DELETE' });
      await sbFetch('breathing_settings', { method: 'POST', body: JSON.stringify(row) });
    }
  } catch(e) {}
}

// ── AUDIO FADE IN ──
function fadeInAudio(a) {
  a.volume = 0;
  const start = Date.now();
  const fi = setInterval(() => {
    const t = (Date.now()-start)/20000;
    if (t>=1) { a.volume=0.7; clearInterval(fi); return; }
    a.volume = t*0.7;
  }, 100);
}

// ── SESSION ──
function openDay(ds, d) {
  activeDateStr = ds;
  track1Done = false;
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(l=>{wakeLock=l;}).catch(()=>{});

  const isDone = !!(done[ds] && (done[ds].includes('meditation') || done[ds].includes('2m')));
  const doneBtn = document.getElementById('done-btn');
  doneBtn.textContent = isDone ? '↩ Undo' : '✓ Done';
  doneBtn.classList.toggle('undo', isDone);
  document.getElementById('btn-row').classList.add('visible');

  if (currentTab==='m') {
    startTrack1(ds);
  } else {
    startTrack1(ds);
  }
}

function startTrack1(ds) {
  const a1 = document.getElementById('audio-1');
  const t = TRACKS[track1]; if (!t) return;
  a1.src = t.url; a1.currentTime = 0;
  fadeInAudio(a1);
  a1.play().catch(()=>{});

  const p1 = document.getElementById('player-1');
  p1.classList.add('visible'); p1.classList.remove('done-track');
  document.getElementById('player-1-label').textContent = t.label;
  document.getElementById('prog-1').style.width = '0%';
  clearInterval(medTimer1);
  medTimer1 = setInterval(() => updateProgress(1), 1000);

  a1.onended = async () => {
    clearInterval(medTimer1);
    document.getElementById('prog-1').style.width = '100%';
    document.getElementById('player-1').classList.add('done-track');
    if (currentTab==='2m') {
      track1Done = true;
      startTrack2(ds);
    } else {
      await finishSession(ds, false);
    }
  };
}

function startTrack2(ds) {
  const a2 = document.getElementById('audio-2');
  const t = TRACKS[track2]; if (!t) return;
  a2.src = t.url; a2.currentTime = 0;
  fadeInAudio(a2);
  a2.play().catch(()=>{});

  const p2 = document.getElementById('player-2');
  p2.classList.add('visible'); p2.classList.remove('done-track');
  document.getElementById('player-2-label').textContent = t.label;
  document.getElementById('prog-2').style.width = '0%';
  clearInterval(medTimer2);
  medTimer2 = setInterval(() => updateProgress(2), 1000);

  a2.onended = async () => {
    clearInterval(medTimer2);
    document.getElementById('prog-2').style.width = '100%';
    await finishSession(ds, false);
  };
}

function updateProgress(n) {
  const a = document.getElementById(`audio-${n}`);
  const dur = a.duration||0, cur = a.currentTime||0;
  document.getElementById(`prog-${n}`).style.width = (dur>0?(cur/dur)*100:0)+'%';
  document.getElementById(`cur-${n}`).textContent = fmt(cur);
  document.getElementById(`tot-${n}`).textContent = fmt(dur);
}

async function finishSession(ds, manual) {
  clearInterval(medTimer1); clearInterval(medTimer2);
  if (wakeLock) { wakeLock.release(); wakeLock=null; }
  if (!manual && ds) {
    const source = currentTab==='2m' ? '2m' : 'meditation';
    if (!(done[ds] && done[ds].includes(source))) await addDone(ds, source);
  }
  const doneBtn = document.getElementById('done-btn');
  const isDone = !!(done[ds] && (done[ds].includes('meditation')||done[ds].includes('2m')));
  doneBtn.textContent = isDone ? '↩ Undo' : '✓ Done';
  doneBtn.classList.toggle('undo', isDone);
}

function stopSession() {
  ['audio-1','audio-2'].forEach(id => {
    const a = document.getElementById(id); a.pause(); a.currentTime=0; a.onended=null;
  });
  clearInterval(medTimer1); clearInterval(medTimer2);
  if (wakeLock) { wakeLock.release(); wakeLock=null; }
  document.getElementById('player-1').classList.remove('visible','done-track');
  document.getElementById('player-2').classList.remove('visible','done-track');
  document.getElementById('btn-row').classList.remove('visible');
  activeDateStr = null; track1Done = false;
}

async function handleDoneBtn() {
  if (!activeDateStr) return;
  const source = currentTab==='2m' ? '2m' : 'meditation';
  const isDone = !!(done[activeDateStr] && done[activeDateStr].includes(source));
  if (isDone) await removeDone(activeDateStr, source);
  else await addDone(activeDateStr, source);
  stopSession();
}

// ── COMPLETIONS ──
async function loadDone() {
  try {
    const res = await sbFetch('completions?select=date,source');
    const data = await res.json();
    done = {};
    data.forEach(r => {
      if (!done[r.date]) done[r.date] = [];
      done[r.date].push(r.source||'meditation');
    });
  } catch(e) {
    const arr = JSON.parse(localStorage.getItem('done')||'[]');
    done = {}; arr.forEach(d=>{done[d]=['meditation'];});
  }
  buildGrid();
  document.getElementById('streak-label').textContent = Object.keys(done).length + ' done';
}
async function addDone(ds, source) {
  if (!done[ds]) done[ds]=[];
  if (!done[ds].includes(source)) done[ds].push(source);
  localStorage.setItem('done', JSON.stringify(Object.keys(done)));
  buildGrid();
  document.getElementById('streak-label').textContent = Object.keys(done).length + ' done';
  try { await sbFetch('completions',{method:'POST',body:JSON.stringify({date:ds,source})}); } catch(e){}
}
async function removeDone(ds, source) {
  if (done[ds]) { done[ds]=done[ds].filter(s=>s!==source); if (!done[ds].length) delete done[ds]; }
  localStorage.setItem('done', JSON.stringify(Object.keys(done)));
  buildGrid();
  document.getElementById('streak-label').textContent = Object.keys(done).length + ' done';
  try { await sbFetch(`completions?date=eq.${ds}&source=eq.${source}`,{method:'DELETE'}); } catch(e){}
}

// ── GRID ──
function buildGrid() {
  const grid = document.getElementById('grid');
  const todayStr = dateStr(today);
  grid.innerHTML = '';
  for (let i=0; i<100; i++) {
    const d = new Date(today); d.setDate(today.getDate()-i);
    const ds = dateStr(d);
    const sources = done[ds]||[];
    const has2m  = sources.includes('2m');
    const hasMed = sources.includes('meditation');
    const doneClass = has2m ? ' done-2m' : hasMed ? ' done-meditation' : '';
    const el = document.createElement('div');
    el.className = 'bubble'+doneClass+(ds===todayStr?' today':'');
    const num = document.createElement('div');
    num.className='day-num'; num.textContent=d.getDate();
    el.appendChild(num);
    if (i===0||d.getDate()===1) {
      const mo=document.createElement('div');
      mo.className='month-tag';
      mo.textContent=d.toLocaleString('default',{month:'short'});
      el.appendChild(mo);
    }
    el.addEventListener('click', ()=>openDay(ds,d));
    grid.appendChild(el);
  }
}

// ── ADMIN ──
function openAdmin() { buildTrackRows(); document.getElementById('admin-panel').classList.add('visible'); }
function closeAdmin() { document.getElementById('admin-panel').classList.remove('visible'); buildToggles(); }
function adminBgClick(e) { if (e.target===document.getElementById('admin-panel')) closeAdmin(); }
function buildTrackRows() {
  const container=document.getElementById('track-rows'); container.innerHTML='';
  LETTERS.forEach(k=>{
    const row=document.createElement('div'); row.className='track-row';
    const letter=document.createElement('div');
    letter.className='track-letter'+(TRACKS[k]?'':' empty-slot'); letter.textContent=k;
    const nameInput=document.createElement('input');
    nameInput.className='track-name-input'; nameInput.type='text';
    nameInput.placeholder='Track name...';
    nameInput.value=TRACKS[k]?TRACKS[k].label:'';
    nameInput.addEventListener('change',()=>{if(TRACKS[k])TRACKS[k].label=nameInput.value;});
    const fileInput=document.createElement('input');
    fileInput.type='file'; fileInput.accept='audio/*';
    const uploadBtn=document.createElement('button');
    uploadBtn.className='upload-btn'; uploadBtn.textContent=TRACKS[k]?'Replace':'Upload';
    uploadBtn.onclick=()=>fileInput.click();
    fileInput.addEventListener('change',async()=>{
      const file=fileInput.files[0]; if(!file) return;
      uploadBtn.textContent='...';
      try {
        const res=await fetch(`${SUPABASE_URL}/storage/v1/object/audio/${k}.mp3`,{
          method:'POST',
          headers:{'Authorization':`Bearer ${SUPABASE_KEY}`,'apikey':SUPABASE_KEY,'Content-Type':'audio/mpeg','x-upsert':'true'},
          body:file});
        if(res.ok||res.status===200||res.status===201){
          TRACKS[k]={label:nameInput.value||file.name.replace(/\.[^.]+$/,''),url:`${STORAGE_URL}/${k}.mp3?t=${Date.now()}`};
          if(!nameInput.value) nameInput.value=TRACKS[k].label;
          letter.className='track-letter'; uploadBtn.textContent='Replace';
        } else { uploadBtn.textContent='Error'; }
      } catch(e){ uploadBtn.textContent='Error'; }
    });
    row.appendChild(letter); row.appendChild(nameInput); row.appendChild(fileInput); row.appendChild(uploadBtn);
    container.appendChild(row);
  });
}

// ── CONFIRM ──
function openConfirm(ds,d) {
  confirmDateStr=ds;
  const sources=done[ds]||[]; confirmIsDone=sources.length>0;
  document.getElementById('confirm-title').textContent=confirmIsDone?'Undo completion?':'Mark as done?';
  document.getElementById('confirm-sub').textContent=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  document.getElementById('confirm-action-btn').textContent=confirmIsDone?'Undo':'Mark done';
  document.getElementById('confirm').classList.add('visible');
}
function closeConfirm(){document.getElementById('confirm').classList.remove('visible');confirmDateStr=null;}
async function confirmAction(){
  if(!confirmDateStr) return;
  if(confirmIsDone){
    const sources=[...(done[confirmDateStr]||[])];
    for(const s of sources) await removeDone(confirmDateStr,s);
  } else { await addDone(confirmDateStr,'meditation'); }
  closeConfirm();
}
function confirmBgClick(e){if(e.target===document.getElementById('confirm'))closeConfirm();}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&wakeLock&&'wakeLock' in navigator)
    navigator.wakeLock.request('screen').then(l=>{wakeLock=l;}).catch(()=>{});
});

loadSettings();
loadDone();
</script>
