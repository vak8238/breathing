<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breathing">
<title>Breathing</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #4a9e4a;
    --green-dark: #2e6e2e;
    --blue: #2f80ed;
    --bg: #f7f7f5;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-muted: #777;
    --border: rgba(0,0,0,0.10);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111;
      --surface: #1c1c1e;
      --text: #f0f0f0;
      --text-muted: #888;
      --border: rgba(255,255,255,0.10);
    }
  }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    padding-top: calc(var(--safe-top) + 12px);
    padding-bottom: calc(var(--safe-bottom) + 12px);
    overflow: hidden;
  }

  /* TABS */
  .tabs {
    display: flex;
    padding: 0 16px 12px;
    gap: 6px;
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 8px 0;
    font-size: 13px;
    font-weight: 500;
    border-radius: 10px;
    border: 0.5px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, color 0.15s;
  }
  .tab.active {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  /* PAGES */
  .page { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .page.active { display: flex; }

  /* ── BREATHE PAGE ── */
  .breathe-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px 12px;
    overflow-y: auto;
  }

  /* Circle */
  .circle-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-height: 200px;
  }
  .circle-outer {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 0.5px solid var(--border);
    position: relative;
    transition: transform 0.5s ease;
  }
  .circle-outer.expand { transform: scale(1.18); background: #e8f4fd; border-color: #a8d4f5; }
  .circle-outer.hold-in { transform: scale(1.18); background: #e8f4fd; border-color: #a8d4f5; }
  .circle-outer.contract { transform: scale(0.88); background: #edf7ed; border-color: #a8dca8; }
  .circle-outer.hold-out { transform: scale(0.88); background: #edf7ed; border-color: #a8dca8; }
  @media (prefers-color-scheme: dark) {
    .circle-outer.expand, .circle-outer.hold-in { background: #1a2f40; border-color: #2a5070; }
    .circle-outer.contract, .circle-outer.hold-out { background: #1a2e1a; border-color: #2a502a; }
  }
  .circle-inner {
    text-align: center;
  }
  .phase-label {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }
  .phase-count {
    font-size: 36px;
    font-weight: 300;
    color: var(--text);
    line-height: 1;
  }
  .phase-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Progress ring */
  .ring-svg {
    position: absolute;
    top: -4px; left: -4px;
    width: 188px; height: 188px;
    transform: rotate(-90deg);
  }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 3; }
  .ring-fill { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 565; stroke-dashoffset: 565; transition: stroke-dashoffset 1s linear; }

  /* Controls */
  .controls {
    width: 100%;
  }
  .interval-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .interval-box {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .interval-box-label {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .interval-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .interval-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 0.5px solid var(--border);
    background: var(--bg);
    font-size: 16px;
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .interval-val {
    font-size: 20px;
    font-weight: 400;
    color: var(--text);
    flex: 1;
    text-align: center;
  }

  .duration-row {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .duration-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .duration-label { font-size: 12px; color: var(--text-muted); }
  .duration-val { font-size: 13px; font-weight: 500; color: var(--text); }
  input[type=range] {
    width: 100%;
    accent-color: var(--blue);
    height: 4px;
  }

  .start-btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: var(--blue);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s;
  }
  .start-btn:active { opacity: 0.85; }
  .start-btn.running { background: #e05; }

  /* ── BUBBLES PAGE ── */
  .bubbles-wrap {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px 16px 12px;
  }
  .bubbles-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 0 10px;
  }
  .bubbles-count { font-size: 13px; color: var(--text-muted); }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .bubble {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: var(--surface);
    transition: transform 0.12s, background 0.25s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .bubble:active { transform: scale(0.88); }
  .bubble.today { border: 2px solid var(--blue); }
  .bubble.done { background: var(--green); border-color: var(--green-dark); }
  .bubble .day-num { font-size: clamp(10px, 3vw, 13px); font-weight: 500; color: var(--text-muted); line-height: 1; }
  .bubble.done .day-num { color: #fff; }
  .bubble.today:not(.done) .day-num { color: var(--blue); }
  .bubble .month-tag { font-size: 8px; color: var(--text-muted); opacity: 0.7; margin-top: 1px; }
  .bubble.done .month-tag { color: rgba(255,255,255,0.75); }

  /* confirm popover */
  .confirm {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 300;
    align-items: flex-end;
  }
  .confirm.visible { display: flex; }
  .confirm-inner {
    background: var(--surface);
    width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + var(--safe-bottom));
    text-align: center;
  }
  .confirm-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .confirm-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  .confirm-btns { display: flex; gap: 10px; }
  .confirm-btn {
    flex: 1; padding: 13px;
    border-radius: 12px;
    border: 0.5px solid var(--border);
    background: transparent;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .confirm-btn.danger { color: #e05; border-color: #e05; }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" onclick="showPage('breathe', this)">Breathe</button>
  <button class="tab" onclick="showPage('bubbles', this)">100 days</button>
</div>

<!-- BREATHE PAGE -->
<div class="page active" id="page-breathe">
  <div class="breathe-wrap">

    <div class="circle-area">
      <div class="circle-outer" id="circle">
        <svg class="ring-svg" viewBox="0 0 188 188">
          <circle class="ring-bg" cx="94" cy="94" r="90"/>
          <circle class="ring-fill" id="ring" cx="94" cy="94" r="90"/>
        </svg>
        <div class="circle-inner">
          <div class="phase-label" id="phase-label">Ready</div>
          <div class="phase-count" id="phase-count">—</div>
          <div class="phase-sub" id="phase-sub"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="interval-grid">
        <div class="interval-box">
          <div class="interval-box-label">Inhale</div>
          <div class="interval-row">
            <button class="interval-btn" onclick="adj('inhale',-1)">−</button>
            <div class="interval-val" id="val-inhale">4</div>
            <button class="interval-btn" onclick="adj('inhale',1)">+</button>
          </div>
        </div>
        <div class="interval-box">
          <div class="interval-box-label">Hold in</div>
          <div class="interval-row">
            <button class="interval-btn" onclick="adj('holdin',-1)">−</button>
            <div class="interval-val" id="val-holdin">4</div>
            <button class="interval-btn" onclick="adj('holdin',1)">+</button>
          </div>
        </div>
        <div class="interval-box">
          <div class="interval-box-label">Exhale</div>
          <div class="interval-row">
            <button class="interval-btn" onclick="adj('exhale',-1)">−</button>
            <div class="interval-val" id="val-exhale">4</div>
            <button class="interval-btn" onclick="adj('exhale',1)">+</button>
          </div>
        </div>
        <div class="interval-box">
          <div class="interval-box-label">Hold out</div>
          <div class="interval-row">
            <button class="interval-btn" onclick="adj('holdout',-1)">−</button>
            <div class="interval-val" id="val-holdout">4</div>
            <button class="interval-btn" onclick="adj('holdout',1)">+</button>
          </div>
        </div>
      </div>

      <div class="duration-row">
        <div class="duration-top">
          <span class="duration-label">Total duration</span>
          <span class="duration-val" id="dur-label">5 min</span>
        </div>
        <input type="range" min="1" max="30" value="5" id="dur-slider" oninput="updateDur()">
      </div>

      <button class="start-btn" id="start-btn" onclick="toggleSession()">Start</button>
    </div>
  </div>
</div>

<!-- BUBBLES PAGE -->
<div class="page" id="page-bubbles">
  <div class="bubbles-wrap">
    <div class="bubbles-header">
      <div class="bubbles-count" id="streak-label">0 done</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- CONFIRM POPOVER -->
<div class="confirm" id="confirm" onclick="confirmBgClick(event)">
  <div class="confirm-inner">
    <div class="confirm-title" id="confirm-title">Mark as done?</div>
    <div class="confirm-sub" id="confirm-sub"></div>
    <div class="confirm-btns">
      <button class="confirm-btn" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-btn danger" id="confirm-action-btn" onclick="confirmAction()">Confirm</button>
    </div>
  </div>
</div>

<script>
// ── SUPABASE ──
const SUPABASE_URL = 'https://zymulpyuxxpqbtqxkrmu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5bXVscHl1eHhwcWJ0cXhrcm11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2OTg1NjAsImV4cCI6MjA5MTI3NDU2MH0.qdl9-l45Fv-prTECEXhUl8S5QeTA8qIJ6YuoRgEYJUc';
const TABLE = 'completions';

async function sbFetch(path, opts={}) {
  return fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal', ...opts.headers },
    ...opts
  });
}

// ── STATE ──
let intervals = { inhale: 4, holdin: 4, exhale: 4, holdout: 4 };
let durMin = 5;
let running = false;
let sessionTimer = null;
let phaseTimer = null;
let sessionEndTime = null;
let currentPhaseIdx = 0;
let phaseSecondsLeft = 0;
let done = [];
let confirmDateStr = null;
let confirmIsDone = false;

const phases = [
  { key: 'inhale',  label: 'Inhale',   circle: 'expand',   haptic: [50] },
  { key: 'holdin',  label: 'Hold',     circle: 'hold-in',  haptic: [30,50,30] },
  { key: 'exhale',  label: 'Exhale',   circle: 'contract', haptic: [80] },
  { key: 'holdout', label: 'Hold',     circle: 'hold-out', haptic: [30,50,30] },
];

const today = new Date(); today.setHours(0,0,0,0);
function dateStr(d) { return d.toISOString().split('T')[0]; }
function fmt(s) { s = Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

// ── AUDIO CONTEXT for tone cues ──
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, dur, vol=0.15) {
  try {
    const ctx = getAudioCtx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq;
    o.type = 'sine';
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function cue(phase) {
  // haptic first
  if (navigator.vibrate) {
    if (phase === 'inhale') navigator.vibrate(60);
    else if (phase === 'holdin') navigator.vibrate([40,40,40]);
    else if (phase === 'exhale') navigator.vibrate(100);
    else if (phase === 'holdout') navigator.vibrate([40,40,40]);
  }
  // tone fallback / supplement
  if (phase === 'inhale') playTone(528, 0.15, 0.12);
  else if (phase === 'holdin') playTone(440, 0.1, 0.08);
  else if (phase === 'exhale') playTone(396, 0.18, 0.12);
  else if (phase === 'holdout') playTone(330, 0.1, 0.08);
}

// ── INTERVAL CONTROLS ──
function adj(key, delta) {
  intervals[key] = Math.max(0, Math.min(20, intervals[key] + delta));
  document.getElementById('val-' + key).textContent = intervals[key];
}
function updateDur() {
  durMin = parseInt(document.getElementById('dur-slider').value);
  document.getElementById('dur-label').textContent = durMin + ' min';
}

// ── SESSION ──
function toggleSession() {
  if (running) stopSession(true);
  else startSession();
}

function startSession() {
  // unlock audio
  getAudioCtx();
  running = true;
  sessionEndTime = Date.now() + durMin * 60 * 1000;
  document.getElementById('start-btn').textContent = 'Stop';
  document.getElementById('start-btn').classList.add('running');
  currentPhaseIdx = 0;
  startPhase();
}

function startPhase() {
  if (!running) return;
  const phase = phases[currentPhaseIdx];
  const secs = intervals[phase.key];

  // skip zero-duration phases
  if (secs === 0) {
    currentPhaseIdx = (currentPhaseIdx + 1) % 4;
    startPhase();
    return;
  }

  phaseSecondsLeft = secs;
  cue(phase.key);

  updateCircle(phase, secs, secs);
  clearInterval(phaseTimer);
  phaseTimer = setInterval(() => {
    phaseSecondsLeft--;
    const remaining = sessionEndTime - Date.now();
    if (remaining <= 0) { stopSession(false); return; }
    if (phaseSecondsLeft <= 0) {
      clearInterval(phaseTimer);
      currentPhaseIdx = (currentPhaseIdx + 1) % 4;
      startPhase();
    } else {
      updateCircle(phase, phaseSecondsLeft, secs);
    }
  }, 1000);
}

function updateCircle(phase, left, total) {
  const circle = document.getElementById('circle');
  circle.className = 'circle-outer ' + phase.circle;
  document.getElementById('phase-label').textContent = phase.label;
  document.getElementById('phase-count').textContent = left;
  const remaining = Math.max(0, sessionEndTime - Date.now());
  document.getElementById('phase-sub').textContent = fmt(remaining / 1000) + ' left';
  const circumference = 565;
  const offset = circumference - (circumference * (1 - (left / total)));
  document.getElementById('ring').style.strokeDashoffset = offset;
}

async function stopSession(manual) {
  running = false;
  clearInterval(phaseTimer);
  clearInterval(sessionTimer);
  document.getElementById('start-btn').textContent = 'Start';
  document.getElementById('start-btn').classList.remove('running');
  document.getElementById('circle').className = 'circle-outer';
  document.getElementById('phase-label').textContent = 'Done';
  document.getElementById('phase-count').textContent = '—';
  document.getElementById('phase-sub').textContent = '';
  document.getElementById('ring').style.strokeDashoffset = 565;

  if (!manual) {
    // auto-mark done
    const ds = dateStr(today);
    if (!done.includes(ds)) await addDone(ds);
  }
}

// ── SUPABASE DONE ──
async function loadDone() {
  try {
    const res = await sbFetch(`${TABLE}?select=date`);
    const data = await res.json();
    done = data.map(r => r.date);
  } catch(e) {
    done = JSON.parse(localStorage.getItem('done')||'[]');
  }
  buildGrid();
  document.getElementById('streak-label').textContent = done.length + ' done';
}

async function addDone(ds) {
  done.push(ds);
  localStorage.setItem('done', JSON.stringify(done));
  buildGrid();
  document.getElementById('streak-label').textContent = done.length + ' done';
  try { await sbFetch(TABLE, { method: 'POST', body: JSON.stringify({ date: ds }) }); } catch(e) {}
}

async function removeDone(ds) {
  done = done.filter(d => d !== ds);
  localStorage.setItem('done', JSON.stringify(done));
  buildGrid();
  document.getElementById('streak-label').textContent = done.length + ' done';
  try { await sbFetch(`${TABLE}?date=eq.${ds}`, { method: 'DELETE' }); } catch(e) {}
}

// ── GRID ──
function buildGrid() {
  const grid = document.getElementById('grid');
  const todayStr = dateStr(today);
  grid.innerHTML = '';
  for (let i = 0; i < 100; i++) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    const ds = dateStr(d);
    const el = document.createElement('div');
    el.className = 'bubble' + (done.includes(ds) ? ' done' : '') + (ds === todayStr ? ' today' : '');
    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = d.getDate();
    el.appendChild(num);
    if (i === 0 || d.getDate() === 1) {
      const mo = document.createElement('div');
      mo.className = 'month-tag';
      mo.textContent = d.toLocaleString('default', {month: 'short'});
      el.appendChild(mo);
    }
    el.addEventListener('click', () => openConfirm(ds, d));
    grid.appendChild(el);
  }
}

// ── CONFIRM ──
function openConfirm(ds, d) {
  confirmDateStr = ds;
  confirmIsDone = done.includes(ds);
  const opts = {weekday: 'short', month: 'short', day: 'numeric'};
  document.getElementById('confirm-title').textContent = confirmIsDone ? 'Undo completion?' : 'Mark as done?';
  document.getElementById('confirm-sub').textContent = d.toLocaleDateString(undefined, opts);
  document.getElementById('confirm-action-btn').textContent = confirmIsDone ? 'Undo' : 'Mark done';
  document.getElementById('confirm').classList.add('visible');
}
function closeConfirm() {
  document.getElementById('confirm').classList.remove('visible');
  confirmDateStr = null;
}
async function confirmAction() {
  if (!confirmDateStr) return;
  if (confirmIsDone) await removeDone(confirmDateStr);
  else await addDone(confirmDateStr);
  closeConfirm();
}
function confirmBgClick(e) {
  if (e.target === document.getElementById('confirm')) closeConfirm();
}

// ── TABS ──
function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
}

// ── INIT ──
loadDone();
</script>
</body>
</html>
